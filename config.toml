[scope]
sample_size = 100000
seed = "spotify-final-2026-v1"
force_golden = true
mode = "partial"
out_of_scope_reason = "not_classified_partial_run"

[ingestion]
chunk_size = 5000

[models]
jev = "jev-1.13.0"
luna = "gpt-6-luna"
effort = "none"
service_tier = "default"
allow_flex = false
allow_batch = false
flag_returned_model_change = true
output_token_cap = 4096

[controls]
project_api_cap_usd = 10.0
pilot_api_cap_usd = 0.5
max_workers = 1
fallback_fraction = 0.2
jev_requests_per_second = 60
jev_input_tokens_per_second = 100000
max_transient_attempts = 3
pessimistic_connection_retries = true
connection_max_attempts = 3
per_item_call_limit = 4
invalid_output_retries = 1
terminal_failure_window = 100
terminal_failure_minimum = 20
terminal_failure_threshold = 0.05
run_api_cap_usd = 0.5
ledger_path = "artifacts/spend.sqlite3"
token_overhead_bound = 2048
request_timeout_seconds = 60.0
connect_timeout_seconds = 15.0
lease_seconds = 300.0
backoff_base_seconds = 1.0
backoff_max_seconds = 30.0
backoff_jitter_seconds = 0.5

[enrichment]
jev_prompt = "jev-v3.json"
luna_prompt = "luna-enrich-v2.txt"
needs_review_policy = "persistent-context-reasons-v1"
confidence_scope = "classification-fields-v1"
batch_size = 20
luna_input_token_bound = 24000
luna_output_tokens_per_review = 200
confidence_threshold = 0.60
probability_margin_threshold = 0.0
fallback_selection_policy = "lowest-confidence-v1"
short_review_chars = 240
entity_terms = ["Spotify", "Premium", "playlist", "playlists", "lyrics", "downloads", "offline", "ads"]

[pilot]
transient_attempts = 1
verification_sample_size = 10
seed = "spotify-cost-pilot-v1"
memo_output_token_cap = 1200
group_output_token_cap = 512
preflight_output_token_cap = 256
jev_scope_cost_threshold_usd = 4.0

[provider_preflight]
verified_date = "2026-10-14"
jev_returned_model = "jev-1.13.0"
luna_returned_model = "gpt-6-luna"
typesafe_console_requests_per_second = 80
typesafe_console_input_tokens_per_second = 100000
openai_reported_request_limit = 5000
openai_reported_token_limit = 2000000
evidence = "artifacts/preflight/result.json"
note = "TypeSafe limits from user console; OpenAI limits from response headers; runtime remains conservative."

[rate_limits.typesafe]
rpm = 3600
tpm = 6000000

[rate_limits.openai]
rps = 1
tps = 100000
rpm = 3000
tpm = 1200000

[verification]
sample_size = 500
batch_size = 50
exclude_golden = true
human_review_cap = 20

[evaluation]
sentiment_tolerance = 0.25

[grouping]
allow_multi_issue = false
require_succeeded_group_call_each_full_run = true

[deployment]
frontend_backend = "vercel"
database = "neon"
deployment_protection = false
require_signed_out_check = true

[planning_rates]
confirmed_date = "2026-10-13"
jev_input_per_million = 0.042
jev_output_per_million = 0.0
luna_input_per_million = 0.10
luna_cached_input_per_million = 0.01
luna_output_per_million = 0.50
luna_cache_write_per_million = 0.125
